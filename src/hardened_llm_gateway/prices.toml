# List prices on each provider's PAID tier, in USD per 1 million tokens.
#
# The gateway runs on free tiers, so these numbers say what the traffic would cost on a
# paid plan. They make models and routing strategies comparable on cost.
#
# Keys are "<provider>/<model>", exactly as clients send them. A model missing here has
# no known price and its cost is reported as unknown, never as 0.
# A `changes` entry is a price that starts on its `from` date (UTC).
#
# Simplifications, all of which make the cost an upper bound or a close estimate:
# - text prices only (the gateway only sends text);
# - cached-input discounts are ignored;
# - for models priced by prompt length, the price for prompts up to 200k tokens is used.
#
# Sources, checked 2026-11-17:
# - groq:   the "pricing" field of GET https://api.groq.com/openai/v1/models
#           (allam-2-7b has no price there, so it is left out)
# - gemini: https://aistudio.google.com/docs/pricing (Standard paid tier)
#
# Checked 2026-11-26:
# - cohere: https://cohere.com/pricing lists no per-token price for the Command A
#           models, so these are Cohere's prices as listed by OpenRouter
#           (GET https://openrouter.ai/api/v1/models, provider Cohere)
# - zai:    https://docs.z.ai/guides/overview/pricing (the -flash models are free
#           on every tier, so they cost 0)

# --- Groq --------------------------------------------------------------------

[models."groq/openai/gpt-oss-20b"]
input = 0.075
output = 0.30

