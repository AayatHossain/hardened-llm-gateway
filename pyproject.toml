[project]
name = "hardened-llm-gateway"
version = "0.1.0"
description = "An LLM gateway that routes, caches, guards and traces model calls, with every part measured against a baseline."
license = "MIT"
authors = [{ name = "Md. Aayat Hossain Mridha" }]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4",
    "openai>=3.42.1",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
# Supply-chain safety: ignore package files uploaded in the last 14 days,
# so a freshly compromised release is never picked up automatically.
exclude-newer = "14 days"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP newer syntax, B likely bugs, SIM simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
